name: Build APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Project + Debug
        run: |
          ls -la
          unzip -o zerotouch-ai_1.zip
          ls -la
          ls -la zerotouch-ai || echo "❌ zerotouch-ai folder nahi mila!"
          ls -la zerotouch-ai/app || echo "❌ app folder missing!"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3   # Updated to v3

      - name: Build with Full Debug
        run: |
          cd zerotouch-ai || { echo "❌ Cannot cd into zerotouch-ai"; exit 1; }
          chmod +x gradlew
          ls -la
          ./gradlew assembleDebug --stacktrace --info || echo "Build failed with above error"
        continue-on-error: false

      - name: Upload APK (if exists)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: zerotouch-ai/app/build/outputs/apk/debug/app-debug.apk
